server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── CORS proxy for Gutendex API ─────────────────────────────────────
    location /api/gutendex/ {
        proxy_pass https://gutendex.com/;
        proxy_set_header Host gutendex.com;
        proxy_set_header Origin "";
        proxy_ssl_server_name on;
    }

    # ── CORS proxy for Gutenberg text files ─────────────────────────────
    location /api/gutenberg/ {
        proxy_pass https://www.gutenberg.org/;
        proxy_set_header Host www.gutenberg.org;
        proxy_set_header Origin "";
        proxy_ssl_server_name on;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
